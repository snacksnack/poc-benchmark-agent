name: Benchmark

# Scored runs execute from a GitHub-hosted runner, never a laptop (ADR 0014).
# Never on push: every run spends Neon compute. Two triggers, both deliberate:
# manual dispatch (needs this file on main), or adding a `benchmark: <task>`
# label to a PR, which runs the PR's own copy of this file. Same-repo PRs
# only; fork PRs never receive the secret.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [noise-gate, corpus-load, profile, tier-probe, harness-baselines]
        default: noise-gate

concurrency:
  group: benchmark
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.label.name, 'benchmark: ') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # GitHub caps a hosted job at 6 h. harness-baselines is ~3.5 h; its step
    # has its own limit so the report, cleanup and upload steps still run.
    timeout-minutes: 350
    steps:
      - name: Resolve task
        env:
          LABEL: ${{ github.event.label.name }}
          INPUT: ${{ inputs.task }}
        run: |
          echo "TASK=${INPUT:-${LABEL#benchmark: }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync
        run: uv sync

      - name: Record runner
        run: |
          echo "runner_os=$RUNNER_OS arch=$RUNNER_ARCH image=$ImageOS/$ImageVersion cpus=$(nproc)"
          uv run pocbench fingerprint

      # Every task runs against the frozen criteria; a changed criteria file
      # or pinned input stops the job before it spends compute (ADR 0019).
      - name: Verify criteria pin
        run: uv run pocbench verify-criteria

      - name: Noise gate
        if: env.TASK == 'noise-gate'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: uv run pocbench gate --out runs/phase0

      # Phase 1 (RC1-629). corpus-load resumes if it is cut off; profile and
      # tier-probe delete every branch they create.
      - name: Corpus load
        if: env.TASK == 'corpus-load'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: uv run pocbench corpus-load --out runs/phase1

      - name: Profile
        if: env.TASK == 'profile'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: uv run pocbench profile --out runs/phase1

      - name: Tier probe
        if: env.TASK == 'tier-probe'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: uv run pocbench tier-probe --out runs/phase1

      # Phase 3 (RC1-631): both baselines through the development entry
      # point, every load-model level, both cache states, interleaved. The
      # job stops itself (exit 2) if the runner's network fails the probe
      # rule (R9); that is a result, not a flake.
      - name: Harness baselines
        if: env.TASK == 'harness-baselines'
        timeout-minutes: 320
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: uv run pocbench harness-baselines --out runs/phase3 --levels 1,8,32

      - name: Harness evaluation gate (must refuse)
        if: env.TASK == 'harness-baselines'
        run: |
          if uv run pocbench harness-eval; then
            echo "evaluation ran without a frozen candidate" >&2
            exit 1
          fi

      - name: Harness report
        if: always() && env.TASK == 'harness-baselines'
        run: |
          uv run pocbench verify-record runs/phase3/record.jsonl
          uv run pocbench harness-report --run-dir runs/phase3 --results runs/phase3/results \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --write runs/phase3/results/phase3-baselines.md

      # A cancelled or timed-out step skips Python's finally block; this
      # deletes any branch the run left behind so no compute keeps billing.
      - name: Clean up run branches
        if: always() && env.TASK == 'harness-baselines'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: uv run pocbench cleanup-branches --prefix p3-

      # Raw per-query logs and result JSON; summaries are committed by hand
      # after review.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TASK }}-${{ github.run_id }}
          path: runs/
          retention-days: 90

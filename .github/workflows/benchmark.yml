name: Benchmark

# Scored runs execute from a GitHub-hosted runner, never a laptop (ADR 0014).
# Manual dispatch only: every run spends Neon compute.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [noise-gate]
        default: noise-gate

concurrency:
  group: benchmark
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync
        run: uv sync

      - name: Record runner
        run: |
          echo "runner_os=$RUNNER_OS arch=$RUNNER_ARCH image=$ImageOS/$ImageVersion cpus=$(nproc)"
          uv run pocbench fingerprint

      - name: Noise gate
        if: inputs.task == 'noise-gate'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: uv run pocbench gate --out runs/phase0

      # Raw per-query logs and gate.json; the summary is committed by hand
      # into docs/noise-gate.md after review.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.task }}-${{ github.run_id }}
          path: runs/
          retention-days: 90

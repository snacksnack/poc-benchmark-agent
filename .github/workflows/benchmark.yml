name: Benchmark

# Scored runs execute from a GitHub-hosted runner, never a laptop (ADR 0014).
# Never on push: every run spends Neon compute. Two triggers, both deliberate:
# manual dispatch (needs this file on main), or adding a `benchmark: <task>`
# label to a PR, which runs the PR's own copy of this file. Same-repo PRs
# only; fork PRs never receive the secret.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options: [noise-gate, corpus-load, profile, tier-probe, harness-baselines, phase4,
                  phase4-status]
        default: noise-gate
      chain_left:
        description: "Phase 4: how many more jobs this chain may dispatch"
        type: string
        default: "14"

concurrency:
  group: benchmark
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    # Phase 4 commits its state back to the branch and dispatches the next
    # job (R15, ADR 0024); the other tasks only read.
    permissions:
      contents: write
      actions: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.label.name, 'benchmark: ') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # GitHub caps a hosted job at 6 h. harness-baselines is ~3.5 h; its step
    # has its own limit so the report, cleanup and upload steps still run.
    timeout-minutes: 350
    steps:
      - name: Resolve task
        env:
          LABEL: ${{ github.event.label.name }}
          INPUT: ${{ inputs.task }}
        run: |
          echo "TASK=${INPUT:-${LABEL#benchmark: }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync
        run: uv sync

      - name: Record runner
        run: |
          echo "runner_os=$RUNNER_OS arch=$RUNNER_ARCH image=$ImageOS/$ImageVersion cpus=$(nproc)"
          uv run pocbench fingerprint

      # Every task runs against the frozen criteria; a changed criteria file
      # or pinned input stops the job before it spends compute (ADR 0019).
      - name: Verify criteria pin
        run: uv run pocbench verify-criteria

      - name: Noise gate
        if: env.TASK == 'noise-gate'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: uv run pocbench gate --out runs/phase0

      # Phase 1 (RC1-629). corpus-load resumes if it is cut off; profile and
      # tier-probe delete every branch they create.
      - name: Corpus load
        if: env.TASK == 'corpus-load'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: uv run pocbench corpus-load --out runs/phase1

      - name: Profile
        if: env.TASK == 'profile'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: uv run pocbench profile --out runs/phase1

      - name: Tier probe
        if: env.TASK == 'tier-probe'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: uv run pocbench tier-probe --out runs/phase1

      # Phase 3 (RC1-631): both baselines through the development entry
      # point, every load-model level, both cache states, interleaved. The
      # job stops itself (exit 2) if the runner's network fails the probe
      # rule (R9); that is a result, not a flake.
      - name: Harness baselines
        if: env.TASK == 'harness-baselines'
        timeout-minutes: 320
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: uv run pocbench harness-baselines --out runs/phase3 --levels 1,8,32

      - name: Harness evaluation gate (must refuse)
        if: env.TASK == 'harness-baselines'
        run: |
          if uv run pocbench harness-eval; then
            echo "evaluation ran without a frozen candidate" >&2
            exit 1
          fi

      - name: Harness report
        if: always() && env.TASK == 'harness-baselines'
        run: |
          uv run pocbench verify-record runs/phase3/record.jsonl
          uv run pocbench harness-report --run-dir runs/phase3 --results runs/phase3/results \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --write runs/phase3/results/phase3-baselines.md

      # A cancelled or timed-out step skips Python's finally block; this
      # deletes any branch the run left behind so no compute keeps billing.
      - name: Clean up run branches
        if: always() && env.TASK == 'harness-baselines'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: uv run pocbench cleanup-branches --prefix p3-

      # Phase 4 (RC1-632). One task, `phase4`, does whatever the committed
      # state says is next: the adaptive loop, the held-out evaluation, or
      # the final pooling. Each job commits its state and, if work remains,
      # dispatches the next job on this branch (ADR 0024).
      - name: Phase 4 next step
        if: env.TASK == 'phase4' || env.TASK == 'phase4-status'
        run: echo "NEXT=$(uv run pocbench phase4-next)" >> "$GITHUB_ENV"

      - name: Phase 4 status
        if: env.TASK == 'phase4-status'
        run: |
          echo "next phase4 task: $NEXT (chain_left=${{ inputs.chain_left }}, ref=${{ github.ref_name }})"
          uv run pocbench harness-eval || true

      - name: Evaluation gate (must refuse before the freeze)
        if: env.TASK == 'phase4' && env.NEXT == 'loop'
        run: |
          if uv run pocbench harness-eval; then
            echo "evaluation gate opened before the loop froze anything" >&2
            exit 1
          fi

      # The step records its own exit code so the chain step can tell a clean
      # pause or network rejection (0, 2) from a failure (anything else).
      - name: Phase 4 loop
        if: env.TASK == 'phase4' && env.NEXT == 'loop'
        timeout-minutes: 335
        shell: bash {0}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # LLM Obs for the loop's proposer (ADR 0026); decoration only.
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_SITE: datadoghq.com
          DD_ENV: prod
        run: |
          uv run pocbench loop-run --minutes 315
          rc=$?; echo "STEP_RC=$rc" >> "$GITHUB_ENV"; exit $rc

      - name: Phase 4 held-out evaluation
        if: env.TASK == 'phase4' && env.NEXT == 'evaluate'
        timeout-minutes: 335
        shell: bash {0}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          uv run pocbench eval-run --minutes 315
          rc=$?; echo "STEP_RC=$rc" >> "$GITHUB_ENV"; exit $rc

      - name: Phase 4 evaluation report
        if: env.TASK == 'phase4' && env.NEXT == 'eval-report'
        shell: bash {0}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run pocbench eval-report
          rc=$?; echo "STEP_RC=$rc" >> "$GITHUB_ENV"; exit $rc

      - name: Clean up Phase 4 branches
        if: always() && env.TASK == 'phase4'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: uv run pocbench cleanup-branches --prefix p4-

      - name: Verify Phase 4 records
        if: always() && env.TASK == 'phase4'
        run: |
          for f in results/phase4/loop-log.jsonl results/phase4/dev-record.jsonl \
                   results/phase4/eval-record.jsonl; do
            [ -f "$f" ] && uv run pocbench verify-record "$f"
          done; true

      - name: Commit Phase 4 state
        if: always() && env.TASK == 'phase4'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only paths that exist: one missing pathspec makes git add
          # stage nothing, which once dropped a whole job's loop log.
          paths=()
          for p in results/phase4 candidates; do [ -e "$p" ] && paths+=("$p"); done
          [ ${#paths[@]} -gt 0 ] && git add -- "${paths[@]}"
          if git diff --cached --quiet; then
            echo "no state change"
          else
            git commit -m "RC1-632: phase4 $NEXT job ${{ github.run_id }} (rc ${STEP_RC:-none})"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
          echo "STATE_COMMITTED=1" >> "$GITHUB_ENV"

      # Raw per-query logs and result JSON. Phase 4 evaluation artifacts are
      # fetched back by the final pooling, so they keep a fixed name.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TASK == 'phase4' && env.NEXT || env.TASK }}-${{ github.run_id }}
          path: runs/
          retention-days: 90

      - name: Dispatch the next Phase 4 job
        if: always() && !cancelled() && env.TASK == 'phase4'
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN_LEFT: ${{ inputs.chain_left }}
          CHAIN_SWITCH: ${{ vars.POCBENCH_CHAIN }}
        run: |
          after=$(uv run pocbench phase4-next)
          echo "step rc=${STEP_RC:-none}; next=$after; chain_left=$CHAIN_LEFT"
          if [ "$after" = "done" ]; then echo "phase 4 complete"; exit 0; fi
          if [ "${STEP_RC:-x}" != "0" ] && [ "${STEP_RC:-x}" != "2" ]; then
            echo "not chaining after a failed step; a human looks first" >&2; exit 0
          fi
          if [ "${STATE_COMMITTED:-0}" != "1" ]; then
            echo "state was not committed; not chaining" >&2; exit 0
          fi
          if [ "$CHAIN_SWITCH" = "off" ]; then echo "chain switched off"; exit 0; fi
          if [ "${CHAIN_LEFT:-0}" -le 0 ]; then echo "chain budget spent" >&2; exit 0; fi
          gh workflow run benchmark.yml --ref "${{ github.ref_name }}" \
            -f task=phase4 -f chain_left=$((CHAIN_LEFT - 1))

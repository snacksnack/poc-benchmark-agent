[project]
name = "poc-benchmark-agent"
version = "0.1.0"
description = "Profile a customer's database workload, recommend a configuration, and prove it with an honest benchmark"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
pocbench = "pocbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pocbench"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "ddtrace>=2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a reachable Postgres at POCBENCH_TEST_DSN (skipped otherwise)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

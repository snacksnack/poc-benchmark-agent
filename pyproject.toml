[project]
name = "poc-benchmark-agent"
version = "0.1.0"
description = "Profile a customer's database workload, recommend a configuration, and prove it with an honest benchmark"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
pocbench = "pocbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pocbench"]

[dependency-groups]
# The shared eval harness, pinned by tag: if the ruler moves under a run, a
# changed score no longer says whether the subject or the measurement moved.
# `llmobs` because the subject has a model caller to trace (ADR 0026).
evals = [
    "agent-evals[sql,llmobs] @ git+https://github.com/snacksnack/agent-evals@v0.6.3",
]
# Only the Pages build reads markdown (ADR 0027), so the renderer stays out of
# the runtime dependencies.
site = [
    "markdown-it-py>=3",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "ddtrace>=2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a reachable Postgres at POCBENCH_TEST_DSN (skipped otherwise)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
